services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nemus
      POSTGRES_PASSWORD: nemus
      POSTGRES_DB: nemus_tenders
    ports:
      - "5432:5432"
    volumes:
      - nemus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nemus -d nemus_tenders"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nemus_pgdata:
